# Include inside the erlix.net server block BEFORE a broad `location /api/` proxy.
# Routes only license-status to the BCC license API (port 5002).
#
#   include /etc/nginx/snippets/bcc-license-status.conf;

location = /api/license-status {
    proxy_pass http://127.0.0.1:5002/license-status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
