# Example: HTTPS server block for erlix.net (reference only — not auto-installed).
# The include MUST appear before the broad LinkCheck /api/ proxy.

server {
    listen 443 ssl http2;
    server_name erlix.net www.erlix.net;

    # ... ssl_certificate, root, other includes ...

    # Outlook licensing-api (exact match — port 5003). BEFORE generic /api/.
    include /etc/nginx/snippets/erlix-license-status.conf;

    # LinkCheck and other API routes (do not remove)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000/;   # example upstream — adjust to your server
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # webhooks, static sites, etc. unchanged ...
}
