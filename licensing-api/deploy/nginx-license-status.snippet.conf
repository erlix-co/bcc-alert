# Install on erlix.net BEFORE any broad `location /api/` block that proxies to LinkCheck.
#
#   sudo cp licensing-api/deploy/nginx-license-status.snippet.conf /etc/nginx/snippets/erlix-license-status.conf
#   include /etc/nginx/snippets/erlix-license-status.conf;   # inside server { } for erlix.net
#   sudo nginx -t && sudo systemctl reload nginx

location = /api/license-status {
    proxy_pass http://127.0.0.1:5003/license-status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
