<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BCC Alert Runtime</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="./launchevent.js"></script>
    <script src="./taskpane.js" defer></script>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0d1527;
        color: #e8eefc;
      }
      main {
        padding: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: #c3d2f7;
        font-size: 13px;
        line-height: 1.45;
      }
      .status {
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
        font-size: 13px;
      }
      .ok {
        background: #123528;
        color: #d5fbe2;
      }
      .warn {
        background: #3b1f21;
        color: #ffd8dc;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        color: #fff;
        background: #2663eb;
        cursor: pointer;
        font-weight: 600;
      }
      .small {
        margin-top: 10px;
        color: #9fb1df;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">BCC Alert</h1>
      <p id="description">בדיקה ידנית לפני שליחה לנמענים גלויים מרובים.</p>
      <div id="status" class="status">טוען...</div>
      <button id="refreshBtn" type="button">בדוק עכשיו</button>
      <div id="details" class="small"></div>
    </main>
  </body>
</html>
